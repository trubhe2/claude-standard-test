name: Sync Files
on:
  push:
    branches:
      - main
    paths:
      - README.md
      - .claude/**

jobs:
  repo-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.SYNC_PAT }}
          PR_LABELS: claude-sync
