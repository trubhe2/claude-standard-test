# Config for BetaHuhn/repo-file-sync-action.
# https://github.com/BetaHuhn/repo-file-sync-action
#
# Only the literal top-level key `group` is recognized here (any other
# top-level key is misparsed as a repo name and crashes the action).
# Global options like PR_LABELS are NOT set in this file - they're action
# inputs, set in .github/workflows/sync.yml's `with:` block instead.

group:
  files:
    - source: README.md
      dest: README.md
    - source: .claude
      dest: .claude
  repos: |
    trubhe2/claude-test-repo-a
    trubhe2/claude-test-repo-b